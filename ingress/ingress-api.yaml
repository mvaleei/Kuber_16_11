apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: ingress-api
  namespace: corso

spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /tutti #/api
            pathType: Prefix #/vedi   /vedi/2
            backend:
              service:
                name: immobili-service
                port:
                  number: 80
          - path: /negozio #/api
            pathType: Prefix #/vedi   /vedi/2
            backend:
              service:
                name: negozio-service
                port:
                  number: 80

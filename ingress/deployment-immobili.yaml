apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployment-immobili
  namespace: corso

spec:
  replicas: 1
  selector:
    matchLabels:
      app: immobili-api
  template:
    metadata:
      labels:
        app: immobili-api

    spec:
      containers:
        - name: immobili-api
          image: ghostmio/immo2:v2
          ports:
            - containerPort: 80

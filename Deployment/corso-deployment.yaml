apiVersion: apps/v1
kind: Deployment

metadata:
  name: corso-deployment
  namespace: corso

spec:
  replicas: 5 #desired state - 5 pod sempre attivi
  selector:
    matchLabels:
      app: corso-pod #pod da monitorare
  template:
    metadata:
      labels:
        app: corso-pod #il template del pod da usare per replicare

    spec:
      containers:
        - name: corso-pod
          image: nginx:1.25
          ports:
            - containerPort: 80

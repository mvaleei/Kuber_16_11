apiVersion: v1
kind: Pod

metadata:
  name: pod-liveness
  namespace: prob

spec:
  containers:
    - name: liveness-probe
      image: busybox
      command:
        ["sh", "-c", "sleep 10 && touch /tmp/ready && sleep 20 && exit 1"]
      #readinessProbe:
      #  exec:
      #    command: ["sh", "-c", "test -f /tmp/ready"]
      #  periodSeconds: 2
      livenessProbe:
        exec:
          command: ["sh", "-c", "test -f /tmp/ready"]
        initialDelaySeconds: 5
        periodSeconds: 5

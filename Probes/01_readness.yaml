apiVersion: v1  
kind: Pod   


metadata:
  name: pod-readness
  namespace: prob  

spec: 
  containers:
    - name: readness-probe   
      image: busybox  
      command: ["sh", "-c", "sleep 10 && touch /tmp/ready && sleep 3600"]
      readinessProbe: 
        exec:
          command: ["sh", "-c", "test -f /tmp/ready"] 
        periodSeconds: 2


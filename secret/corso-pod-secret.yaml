apiVersion: v1
kind: Pod
metadata:
  name: corso-pod-secret   
  namespace: corso   

spec:
  containers: 
    - name: pod-test-secret  
      image: busybox
      command: ["sh", "-c", "echo Utente: $USER - password: $PASSWORD && sleep 3600"]
      env:
        - name: USER #xxxxx
          valueFrom: 
            secretKeyRef:
              name: secret-database
              key: utente  
        - name: PASSWORD 
          valueFrom:
            secretKeyRef:
              name: secret-database 
              key: password


apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler    


metadata:
  name: hpa-hpa 
  namespace: scaling   

spec:
  scaleTargetRef:
    apiVersion: apps/v1 
    kind: Deployment 
    name: deployment-scaling  
  minReplicas: 1
  maxReplicas: 10 
  metrics:
  - type: Resource  
    resource: 
      name: cpu 
      target:
        type: Utilization  
        averageUtilization: 10
  behavior:
    scaleDown: 
      stabilizationWindowSeconds: 5

